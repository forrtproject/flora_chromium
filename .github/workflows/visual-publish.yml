name: Attach visual evidence
on:
  workflow_run:
    workflows: [Visual evidence]
    types: [completed]
  pull_request_target:
    types: [edited]
permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write
jobs:
  select:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request_target' && github.event.changes.body && github.event.sender.type == 'User')
    runs-on: ubuntu-24.04
    outputs:
      run-id: ${{ steps.capture.outputs.run-id }}
      pr: ${{ steps.capture.outputs.pr }}
    steps:
      - uses: actions/github-script@v7
        id: capture
        with:
          script: |
            const {owner, repo} = context.repo;
            const run = context.payload.workflow_run;
            const number = context.payload.pull_request?.number ?? run?.pull_requests?.[0]?.number;
            let pr;
            if (number) {
              ({data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number}));
            } else {
              const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open'});
              pr = prs.find(p => p.head.sha === run.head_sha && p.head.repo?.full_name === run.head_repository.full_name);
            }
            if (!pr || pr.state !== 'open') return;
            const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'visual.yml', event: 'pull_request', head_sha: pr.head.sha, per_page: 100});
            const capture = runs.data.workflow_runs.find(r => r.head_repository.full_name === pr.head.repo.full_name);
            if (!capture || capture.status !== 'completed') return;
            core.setOutput('run-id', String(capture.id));
            core.setOutput('pr', String(pr.number));
  describe:
    needs: select
    if: needs.select.outputs.run-id
    concurrency:
      group: visual-publish-${{ github.repository }}-${{ needs.select.outputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      # Both triggers execute default-branch code, never the PR's scripts.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: visual-report
          path: visual-report
          github-token: ${{ github.token }}
          run-id: ${{ needs.select.outputs.run-id }}
      - uses: actions/github-script@v7
        env:
          VISUAL_RUN_ID: ${{ needs.select.outputs.run-id }}
          VISUAL_PR: ${{ needs.select.outputs.pr }}
        with:
          script: |
            const publish = require('./.github/scripts/visual-publish.cjs');
            await publish({github, context});
